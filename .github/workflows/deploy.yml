name: MintlyLib Deploy

# Publica o pacote no npm. NÃO altera a versão — a versão é decidida pelo job
# `auto-version` do ci.yml (bump por mensagem de commit + sufixo -preview em
# staging). Aqui só empacotamos e publicamos o que já está versionado.
#
# Dois modos de uso:
#  - workflow_call: chamado pelo ci.yml logo após o auto-version, no mesmo run
#    do merge (automático). staging -> dist-tag `preview`; main -> `latest`.
#  - workflow_dispatch: fallback manual (Actions -> "MintlyLib Deploy" -> Run).

on:
  workflow_call:
    inputs:
      ref:
        description: Ref (branch) já versionada a publicar
        required: true
        type: string
      dist_tag:
        description: dist-tag do npm (latest | preview)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Canal de publicação
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      confirm_deploy:
        description: Confirme que deseja publicar
        required: true
        default: false
        type: boolean

concurrency:
  group: mintlylib-deploy-${{ inputs.dist_tag || inputs.environment }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (inputs.dist_tag == 'latest' && 'production' || 'staging') }}

    steps:
      - name: Validar confirmação (dispatch manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "true" ]; then
            echo "Publicação cancelada: confirm_deploy não foi marcado."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No modo automático, publica a branch já bumpada pelo auto-version.
          # No dispatch manual, usa a ref onde o workflow foi acionado.
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build package
        run: npm run build:ci

      - name: Validate package contents
        run: npm run pack:check

      - name: Resolver dist-tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # manual: production -> latest, staging -> preview
            if [ "${{ inputs.environment }}" = "production" ]; then
              echo "value=latest" >> "$GITHUB_OUTPUT"
            else
              echo "value=preview" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=${{ inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publicando $(node -p "require('./package.json').version") com dist-tag '${{ steps.tag.outputs.value }}'"
          if [ "${{ steps.tag.outputs.value }}" = "latest" ]; then
            npm publish
          else
            npm publish --tag preview
          fi
