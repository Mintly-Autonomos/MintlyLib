name: MintlyLib CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - staging

concurrency:
  group: mintlylib-ci-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Roda em qualquer PR aberto/atualizado, mas não no evento closed
    if: github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build package
        run: npm run build:ci

      - name: Validate package contents
        run: npm run pack:check

  auto-version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    # Roda apenas quando o PR é mergeado (não em push direto)
    if: github.event.pull_request.merged == true

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Faz checkout da branch base (staging/main), não do merge ref em
          # HEAD destacado — necessário para commitar o bump e dar push de volta.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detectar maior bump em todos os commits do PR
        id: bump
        # Não roda quando é promoção staging → main (versão já foi bumpeada)
        if: >
          !(github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.ref == 'staging')
        run: |
          BUMP="patch"
          while IFS= read -r MSG; do
            if echo "$MSG" | grep -qE '^Merge'; then
              continue
            fi
            if echo "$MSG" | grep -qiE '^release(\(.+\))?[!:]'; then
              BUMP="major"
              break
            elif echo "$MSG" | grep -qiE '^feat(\(.+\))?[!:]'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi
          done <<< "$(git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --format='%s')"

          echo "type=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump detectado: $BUMP"

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promover staging → main (remove sufixo -preview)
        if: >
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'staging'
        run: |
          BASE=$(node -p "require('./package.json').version" | sed 's/-preview$//')
          npm version "$BASE" -m "chore(release): %s [skip ci]"

      - name: Bump de versão (feature → main)
        if: >
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref != 'staging'
        run: |
          npm version ${{ steps.bump.outputs.type }} -m "chore(release): %s [skip ci]"

      - name: Bump de versão (staging — sufixo -preview)
        if: github.event.pull_request.base.ref == 'staging'
        run: |
          # Normaliza para a base de release (sem -preview) ANTES de aplicar o
          # bump: `npm version patch` sobre X-preview apenas finaliza para X
          # (não incrementa o número), o que faria o alvo "${BASE}-preview"
          # ficar igual à versão atual e o npm abortar com "Version not changed".
          # Depois reverte o tree (senão o npm version final recusa com "Git
          # working directory not clean") e grava a versão -preview definitiva.
          CURRENT=$(node -p "require('./package.json').version")
          RELEASE=${CURRENT%-preview}
          npm version "$RELEASE" --no-git-tag-version --allow-same-version
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          NEXT=$(node -p "require('./package.json').version")
          git checkout -- package.json package-lock.json
          npm version "${NEXT}-preview" -m "chore(release): %s [skip ci]"

      - name: Push do commit e tag de versão
        run: git push --follow-tags origin HEAD:${{ github.event.pull_request.base.ref }}

  publish:
    name: Publish to npm
    # Encadeado após o bump: roda no mesmo run do merge, então não esbarra na
    # proteção anti-recursão do GITHUB_TOKEN (que impediria um deploy on:push).
    needs: auto-version
    # Publica apenas em merges para staging (preview) ou main (latest).
    if: >
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'staging' ||
       github.event.pull_request.base.ref == 'main')
    # Reutiliza toda a lógica de publicação do deploy.yml. A branch base já está
    # versionada (auto-version deu push antes); staging -> preview, main -> latest.
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.pull_request.base.ref }}
      dist_tag: ${{ github.event.pull_request.base.ref == 'main' && 'latest' || 'preview' }}
    secrets: inherit
