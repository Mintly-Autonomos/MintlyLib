name: MintlyLib CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: mintlylib-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build package
        run: npm run build:ci

      - name: Validate package contents
        run: npm run pack:check

  auto-version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    needs: quality
    # Roda apenas em push direto na main (não em PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detectar tipo de bump pelo commit
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qiE '^release(\(.+\))?[!:]'; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "label=major (+1.0.0)" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qiE '^feat(\(.+\))?[!:]'; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "label=minor (+0.1.0)" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "label=patch (+0.0.1)" >> $GITHUB_OUTPUT
          fi

      - name: Resumo do bump detectado
        run: echo "Bump detectado -> ${{ steps.bump.outputs.label }}"

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump de versão
        run: npm version ${{ steps.bump.outputs.type }} -m "chore(release): %s [skip ci]"

      - name: Push do commit e tag de versão
        run: git push --follow-tags
